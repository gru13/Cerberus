    title: jsonschema crate documentation
    kind: api-reference
    publisher: docs.rs
    version: jsonschema 0.63.1
    primary: true
    checked: 2026-11-24
- id: protocol.messagepack
  title: MessagePack format
  stories:
  - 4.3.1
  phase: P1
  keywords:
  - messagepack
  - rmp-serde
  - binary format
  - bin type
  notes: |
    MessagePack is a binary format with a native bin type, so no base64 is needed.
    The Rust crate rmp-serde plugs into serde.
    to_vec_named keeps field names, which suits tagged enums.
    The study guide picks JSON first; MessagePack is the alternative.
  sources:
  - url: https://github.com/msgpack/msgpack/blob/master/spec.md
    title: MessagePack specification
    kind: spec
    publisher: MessagePack project
    version: spec.md, master branch
    primary: true
    checked: 2026-11-24
  - url: https://docs.rs/rmp-serde/latest/rmp_serde/
    title: rmp-serde crate documentation
    kind: api-reference
    publisher: docs.rs
    version: rmp-serde 1.3.1
    primary: false
    checked: 2026-11-24
- id: protocol.ndjson-framing
  title: NDJSON and length-delimited framing
  stories:
  - 4.3.1
  phase: P1
  keywords:
  - ndjson
  - LengthDelimitedCodec
  - frame size cap
  - framing
  notes: |
    NDJSON puts one JSON text per line; texts must not contain raw newlines.
    Length-delimited frames use a size prefix instead.
    In tokio-util the codec exposes a max frame length setting.
    Always cap the frame size to stop a huge length prefix.
  sources:
  - url: https://github.com/ndjson/ndjson-spec
    title: NDJSON specification
    kind: spec
    publisher: ndjson project
    version: 1.0.0
    primary: true
    checked: 2026-11-24
  - url: https://docs.rs/tokio-util/latest/tokio_util/codec/length_delimited/struct.LengthDelimitedCodec.html
    title: LengthDelimitedCodec
    kind: api-reference
    publisher: docs.rs
    version: tokio-util 0.7.20
    primary: false
    checked: 2026-11-24
- id: protocol.protocol-semver
  title: Semantic Versioning for the protocol
  stories:
  - 8.9.3
  phase: P1
  keywords:
  - semver
  - major version
  - minor version
  - feature flags
  notes: |
    Apply semver to the protocol: a major change breaks compatibility, so refuse the peer.
    A minor change adds features in a compatible way; negotiate with feature flags.
    A patch fixes bugs without changing the wire format.
    Send the version in the first message.
  sources:
  - url: https://github.com/semver/semver/blob/master/semver.md
    title: Semantic Versioning 2.0.0
    kind: spec
    publisher: semver project
    version: 2.0.0
    primary: true
    checked: 2026-11-24
- id: protocol.pydantic-discriminated-unions
  title: Pydantic discriminated unions
  stories:
  - 8.9.3
  phase: P1
  keywords:
  - discriminator
  - Literal tag
  - tagged union
  - Field
  notes: |
    Field(discriminator="type") picks the union member from one tag field.
    Each member declares the tag as a Literal type.
    This gives faster validation and clearer errors than a plain union.
    It maps to the oneOf plus const shape in the schema.
  sources:
  - url: https://github.com/pydantic/pydantic/blob/main/docs/concepts/unions.md
    title: Unions (Pydantic docs source)
    kind: project-repo
    publisher: Pydantic project
    version: main branch (docs.pydantic.dev now redirects to pydantic.dev)
    primary: true
    checked: 2026-11-24
- id: protocol.schemars
  title: schemars (JSON Schema from Rust types)
  stories:
  - 8.9.3
  phase: P1
  keywords:
  - schemars
  - JsonSchema derive
  - schema_for
  notes: |
    Derive JsonSchema on Rust types, then call schema_for! to get a schema.
    It respects serde attributes.
    Use it only to compare with the hand-written schema file, not as the source.
    A diff shows drift between Rust types and the contract.
  sources:
  - url: https://docs.rs/schemars/latest/schemars/
    title: schemars crate documentation
    kind: api-reference
    publisher: docs.rs
    version: schemars 1.2.3
    primary: true
    checked: 2026-11-24
- id: protocol.serde-tagged-enums
  title: Serde enum representations
  stories:
  - 8.9.3
  phase: P1
  keywords:
  - serde tag
  - internally tagged
  - deny_unknown_fields
  - untagged
  notes: |
    Serde has four enum forms: external (default), internal tag, adjacent tag and content, untagged.
    Internal tagging with tag="type" matches a oneOf plus const schema.
    Internal tags do not allow tuple variants.
    deny_unknown_fields blocks new fields, so it costs forward compatibility.
  sources:
  - url: https://github.com/serde-rs/serde-rs.github.io/blob/master/_src/enum-representations.md
    title: Enum representations (serde.rs source)
    kind: project-repo
    publisher: serde-rs project
    version: master branch; serde 1.0.229 on docs.rs
    primary: true
    checked: 2026-11-24
  - url: https://docs.rs/serde/latest/serde/
    title: serde crate documentation
    kind: api-reference
    publisher: docs.rs
    version: serde 1.0.229
    primary: false
    checked: 2026-11-24
- id: protocol.tokio-tungstenite
  title: tokio-tungstenite
  stories:
  - 4.3.3
  phase: P1
  keywords:
  - tokio-tungstenite
  - accept_hdr_async
  - websocket server
  - handshake callback
  notes: |
    The crate adds async WebSocket streams on top of tungstenite and tokio.
    accept_async upgrades a stream; accept_hdr_async adds a header callback.
    Use the callback to check token and Origin before the upgrade.
    The stream is both a Stream and a Sink of messages.
  sources:
  - url: https://docs.rs/tokio-tungstenite/latest/tokio_tungstenite/
    title: tokio-tungstenite crate documentation
    kind: api-reference
    publisher: docs.rs
    version: tokio-tungstenite 0.30.0
    primary: true
    checked: 2026-11-24
- id: protocol.websocket-rfc6455
  title: WebSocket protocol (RFC 6455)
  stories:
  - 4.3.3
  phase: P1
  keywords:
  - websocket
  - frame opcodes
  - masking
  - close frame
  notes: |
    Frames carry an opcode: text, binary, ping, pong or close.
    Client-to-server frames are masked with a 32-bit key.
    Use binary frames for terminal data and text frames for JSON control messages.
    The handshake is an HTTP upgrade where origin and token checks happen.
  sources:
  - url: https://www.rfc-editor.org/rfc/rfc6455
    title: 'RFC 6455: The WebSocket Protocol'
    kind: spec
    publisher: IETF / RFC Editor
    version: RFC 6455, December 2011
    primary: true
    checked: 2026-11-24
