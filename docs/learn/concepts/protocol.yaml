# Learning index: protocol concepts. The area comes from this file name; entries have no area key.
# Each entry: id (<area>.<name>), title, stories (guided story ids), phase (P0, P1, ...),
#   keywords, notes (short, own words), sources, llms_txt (optional link; omit when none).
# Each source: url (https, allowed host in index.yaml), title, kind, publisher, version,
#   primary (at least one true per concept), checked (date the link was last verified).
# Kinds: official-docs, api-reference, man-page, spec, project-repo.
- id: protocol.base64-rfc4648
  title: Base64 encoding (RFC 4648)
  stories:
  - 8.9.3
  phase: P1
  keywords:
  - base64
  - padding
  - base64url
  - file bodies
  notes: |
    File bytes cannot sit raw in JSON, so encode them as base64 strings.
    The standard alphabet uses plus and slash with equals padding.
    The url-safe form swaps in dash and underscore.
    Pick one form and test it with shared fixtures on both sides.
  sources:
  - url: https://www.rfc-editor.org/rfc/rfc4648
    title: 'RFC 4648: The Base16, Base32, and Base64 Data Encodings'
    kind: spec
    publisher: IETF / RFC Editor
    version: RFC 4648, October 2006
    primary: true
    checked: 2026-11-24
- id: protocol.datamodel-code-generator
  title: datamodel-code-generator
  stories:
  - 8.9.3
  phase: P1
  keywords:
  - codegen
  - pydantic v2
  - jsonschema input
  - version pin
  notes: |
    The tool turns a JSON Schema file into Pydantic v2 models.
