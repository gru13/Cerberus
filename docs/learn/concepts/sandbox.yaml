- id: sandbox.inotify
  title: inotify and IN_Q_OVERFLOW
  stories:
  - 4.3.2
  phase: P1
  keywords:
  - inotify
  - IN_Q_OVERFLOW
  - max_user_watches
  - file watch
  notes: |
    inotify reports file events through a queue.
    If the queue overflows, an IN_Q_OVERFLOW event arrives and events are lost, so rescan.
    max_user_watches limits watches per user.
    Rename produces paired events.
  sources:
  - url: https://man7.org/linux/man-pages/man7/inotify.7.html
    title: inotify(7)
