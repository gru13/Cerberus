    primary: true
    checked: 2026-11-24
- id: sandbox.caddy-stream-close-delay
  title: Caddy stream_close_delay
  stories:
  - 4.4.2
  phase: P1
  keywords:
  - stream_close_delay
  - config reload
  - WebSocket close
  - stream_timeout
  notes: |
    By default a config reload closes WebSocket connections.
    stream_close_delay keeps them open for a set time.
    The docs suggest a value such as 5m as a start.
