# Learning index: sandbox concepts. The area comes from this file name; entries have no area key.
# Each entry: id (<area>.<name>), title, stories (guided story ids), phase (P0, P1, ...),
#   keywords, notes (short, own words), sources, llms_txt (optional link; omit when none).
# Each source: url (https, allowed host in index.yaml), title, kind, publisher, version,
#   primary (at least one true per concept), checked (date the link was last verified).
# Kinds: official-docs, api-reference, man-page, spec, project-repo.
- id: sandbox.asyncio-timeout
  title: asyncio.timeout
  stories:
  - 4.6.3
  phase: P1
  keywords:
  - asyncio.timeout
  - TimeoutError
  - wait_for
  - cancellation
  notes: |
    asyncio.timeout is an async context manager added in Python 3.11.
    At the deadline it cancels the task and raises TimeoutError.
    Catch TimeoutError outside the async with block.
    Code that swallows CancelledError breaks it.
  sources:
  - url: https://docs.python.org/3.14/library/asyncio-task.html
    title: 'Coroutines and Tasks: Timeouts'
    kind: official-docs
    publisher: Python Software Foundation
    version: Python 3.14 docs
    primary: true
    checked: &id001 2026-11-25
- id: sandbox.caddy-admin-api
  title: Caddy admin API
  stories:
  - 4.4.2
  phase: P1
  keywords:
  - admin API
  - POST /load
  - /config/ path
  - localhost:2019
  notes: |
    The admin endpoint listens on localhost:2019 by default.
    POST /load replaces the whole config and rolls back on error.
    /config/[path] reads or patches one part of the config.
    Bind it to a Unix socket if untrusted code runs nearby.
  sources:
  - url: https://caddyserver.com/docs/api
    title: API
    kind: official-docs
    publisher: Caddy project
    version: Caddy 2.x docs, no version shown
    primary: true
    checked: 2026-11-24
- id: sandbox.caddy-forward-auth
  title: Caddy forward_auth
  stories:
  - 4.4.2
  phase: P1
  keywords:
  - forward_auth
  - copy_headers
  - session token check
  - auth gateway
  notes: |
    Caddy sends a copy of each request to an auth gateway.
    A 2xx answer lets the request continue.
    Any other answer goes back to the client.
    copy_headers passes chosen gateway headers to the app.
  sources:
  - url: https://caddyserver.com/docs/caddyfile/directives/forward_auth
    title: forward_auth (Caddyfile directive)
    kind: official-docs
    publisher: Caddy project
