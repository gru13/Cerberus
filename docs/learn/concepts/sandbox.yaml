  stories:
  - 4.2.2
  - 4.6.2
  phase: P1
  keywords:
  - patch
  - -R
  - --reverse
  - reject
  - reversibility
  notes: |
    patch -R swaps each hunk and applies it, which undoes a patch that was applied.
    Applying a patch twice makes patch think it is reversed; it then offers to undo it.
    Use --forward (-N) in scripts so patch never asks and never undoes by guess.
    A clean apply followed by a clean -R must give the baseline bytes back.
