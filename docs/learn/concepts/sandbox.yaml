- id: sandbox.capabilities
  title: Linux capabilities
  stories:
  - 4.1.2
  - 4.2.2
  phase: P1
  keywords:
  - CAP_CHOWN
  - CAP_FOWNER
  - CAP_DAC_OVERRIDE
  - cap-drop
  notes: |
    Root power is split into separate switches.
    CHOWN changes owners; FOWNER skips owner checks such as chmod and timestamps.
    DAC_OVERRIDE skips file permission checks.
    Dropping all caps removes these even for root.
  sources:
  - url: https://man7.org/linux/man-pages/man7/capabilities.7.html
    title: capabilities(7)
    kind: man-page
    publisher: Linux man-pages project
    version: man-pages 6.19
    primary: true
    checked: 2026-11-24
- id: sandbox.cgroup-v2-limits
