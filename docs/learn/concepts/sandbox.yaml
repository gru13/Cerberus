  stories:
  - 4.1.2
  phase: P1
  keywords:
  - memory.max
  - pids.max
  - cpu.max
  - memory.high
  - OOM
  notes: |
    memory.max is a hard cap that can trigger the OOM killer.
    memory.high only throttles.
    pids.max makes fork fail with EAGAIN.
    cpu.max holds quota and period in microseconds.
