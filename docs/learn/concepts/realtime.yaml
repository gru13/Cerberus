# Learning index: realtime concepts. The area comes from this file name; entries have no area key.
# Each entry: id (<area>.<name>), title, stories (guided story ids), phase (P0, P1, ...),
#   keywords, notes (short, own words), sources, llms_txt (optional link; omit when none).
# Each source: url (https, allowed host in index.yaml), title, kind, publisher, version,
#   primary (at least one true per concept), checked (date the link was last verified).
# Kinds: official-docs, api-reference, man-page, spec, project-repo.
- id: realtime.asyncio-future-timeouts
  title: Futures, cancellation and timeouts in asyncio
  stories:
  - 8.4.2
  phase: P1
  keywords:
  - Future
  - set_exception
  - cancel
  - asyncio.timeout
  - wait_for
  - pending requests
  notes: |
    A request map holds one Future per request id; the reader task resolves them.
    On disconnect, call set_exception on each pending Future so no caller hangs.
    Check cancelled() before set_result, or an InvalidStateError can occur.
    asyncio.timeout bounds a block; wait_for bounds one awaitable and cancels it.
  sources:
  - url: https://docs.python.org/3/library/asyncio-future.html
    title: asyncio Future
    kind: official-docs
    publisher: Python Software Foundation
    version: Python 3.15.2 docs
    primary: true
    checked: 2026-11-24
  - url: https://docs.python.org/3/library/asyncio-task.html
    title: Coroutines and Tasks (timeout, wait_for)
    kind: official-docs
    publisher: Python Software Foundation
    version: Python 3.15.2 docs
    primary: false
    checked: 2026-11-24
- id: realtime.asyncio-queue-bounded
  title: Bounded asyncio.Queue
  stories:
  - 8.4.1
  phase: P1
  keywords:
  - maxsize
  - QueueFull
  - put_nowait
  - backpressure
  - slow consumer
  notes: |
    With maxsize above zero, await put() waits until a slot is free.
    put_nowait raises QueueFull instead, which lets the server detect a slow consumer.
    On QueueFull, drop the client or force a resync so memory stays flat.
  sources:
  - url: https://docs.python.org/3/library/asyncio-queue.html
    title: asyncio Queues
    kind: official-docs
    publisher: Python Software Foundation
    version: Python 3.15.2 docs
    primary: true
    checked: 2026-11-24
- id: realtime.asyncio-unix-connection
  title: asyncio.open_unix_connection
  stories:
  - 8.4.2
  phase: P1
  keywords:
  - Unix socket
  - StreamReader
  - StreamWriter
  - limit
  - sun_path
  notes: |
    The coroutine returns a (reader, writer) pair for a Unix domain socket.
    The limit argument sets the reader buffer size; the default is 64 KiB.
    It is available on Unix only.
    Socket path length limits come from the OS, not asyncio (see unix(7)).
  sources:
  - url: https://docs.python.org/3/library/asyncio-stream.html
    title: asyncio Streams
    kind: official-docs
    publisher: Python Software Foundation
    version: Python 3.15.2 docs
    primary: true
    checked: 2026-11-24
- id: realtime.asyncpg-add-listener
  title: asyncpg add_listener
  stories:
  - 8.4.4
  phase: P1
  keywords:
  - asyncpg
  - add_listener
  - notification callback
  - pool
  notes: |
    add_listener(channel, callback) registers a callback on one connection.
    The callback gets connection, pid, channel and payload.
    Releasing a connection to a pool removes its listeners, so use a dedicated connection.
  sources:
  - url: https://magicstack.github.io/asyncpg/current/api/index.html
    title: asyncpg API Reference (Connection.add_listener)
    kind: api-reference
    publisher: MagicStack
    version: asyncpg docs, changelog to 0.32.0
    primary: true
    checked: 2026-11-24
- id: realtime.caddy-flush-interval
  title: Caddy reverse_proxy flush_interval
  stories:
  - 8.4.3
  phase: P1
  keywords:
  - flush_interval
  - '-1'
  - buffering
  - stream_close_delay
  - stream_timeout
  notes: |
    A negative flush_interval (usually -1) turns off response buffering.
    Caddy then flushes after every write, which suits streaming and terminals.
    The same page covers stream_timeout and stream_close_delay for config reloads.
    The page does not describe flush_interval for WebSockets; test it.
  sources:
  - url: https://caddyserver.com/docs/caddyfile/directives/reverse_proxy
    title: reverse_proxy (Caddyfile directive)
    kind: official-docs
    publisher: Caddy
    version: unversioned (current docs)
    primary: true
    checked: 2026-11-24
- id: realtime.origin-check-websocket
  title: Origin check on the WebSocket upgrade
  stories:
  - 8.4.1
  - 8.1.5
  phase: P0
  keywords:
  - CSWSH
  - Origin header
  - cross-site WebSocket hijacking
  - '403'
  - allowlist
  notes: |
    Browsers send cookies on the upgrade, so any site can open a socket as the user.
    The server must compare Origin to an explicit allowlist and refuse with 403.
    Avoid wildcards and substring matching; compare whole origins.
    Origin does not stop non-browser clients, so keep real auth as well.
  sources:
  - url: https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html
    title: WebSocket Security Cheat Sheet
    kind: official-docs
    publisher: OWASP Cheat Sheet Series
    version: unversioned (current)
    primary: true
    checked: 2026-11-24
  - url: https://www.rfc-editor.org/rfc/rfc6455.html#section-10.2
    title: RFC 6455 section 10.2, Origin Considerations
    kind: spec
    publisher: IETF
    version: RFC 6455 (December 2011)
    primary: false
    checked: 2026-11-24
- id: realtime.pg-listen
  title: PostgreSQL LISTEN
  stories:
  - 8.4.4
  phase: P1
  keywords:
  - LISTEN
  - UNLISTEN
  - session scope
  - channel
  notes: |
    LISTEN registers the current session on a channel.
    Registration ends with the session, so a new connection must listen again.
    Events sent while no session listens are not kept; catch up by id.
    LISTEN takes effect at commit of its transaction.
  sources:
  - url: https://www.postgresql.org/docs/current/sql-listen.html
    title: LISTEN
    kind: official-docs
    publisher: PostgreSQL Global Development Group
    version: PostgreSQL 19
    primary: true
    checked: 2026-11-24
- id: realtime.pg-notify
  title: PostgreSQL NOTIFY
  stories:
  - 8.4.4
  phase: P1
  keywords:
  - NOTIFY
  - pg_notify
  - payload limit
  - queue
  - commit delivery
  notes: |
    Notifications deliver only at commit; a rollback discards them.
    The payload must be under 8000 bytes by default; send an id and fetch the row.
    The queue is shared and finite; a full queue makes NOTIFY commits fail.
    Check pg_notification_queue_usage() to watch it.
  sources:
  - url: https://www.postgresql.org/docs/current/sql-notify.html
    title: NOTIFY
    kind: official-docs
    publisher: PostgreSQL Global Development Group
    version: PostgreSQL 19
    primary: true
    checked: 2026-11-24
- id: realtime.pg-terminate-backend
  title: pg_terminate_backend
  stories:
  - 8.4.4
  phase: P1
  keywords:
  - pg_terminate_backend
  - pg_stat_activity
  - fault injection
  - pg_signal_backend
  notes: |
    The function ends the session of a given backend pid.
    It needs superuser or the pg_signal_backend role, or membership of the target role.
    Use it in tests to kill the listener connection and check reconnect and catch-up.
    An optional timeout waits until the process exits.
