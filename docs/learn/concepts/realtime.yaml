- id: realtime.backoff-full-jitter
  title: Exponential backoff with full jitter
  stories:
  - 8.4.2
  phase: P1
  keywords:
  - backoff
  - jitter
  - full jitter
  - retry
  - reconnect
  - thundering herd
  notes: |
    Plain exponential backoff makes many clients retry at the same moments.
    Full jitter sleeps a random time between 0 and min(cap, base * 2^attempt).
    This spreads the retries and lowers the total load on the server.
    Always set a cap and a maximum number of attempts.
  sources:
  - url: https://aws.amazon.com/blogs/architecture/exponential-backoff-and-jitter/
    title: Exponential Backoff and Jitter
    kind: official-docs
    publisher: Amazon Web Services (Architecture Blog)
    version: 2015, updated 2023
    primary: true
    checked: &id001 2026-11-25
  - url: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
    title: Timeouts, retries, and backoff with jitter
    kind: official-docs
    publisher: Amazon Builders' Library
    version: AWS Builder Center
