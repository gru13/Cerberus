    primary: true
    checked: 2026-11-24
- id: realtime.pg-transaction-visibility
  title: Commit order and transaction visibility in PostgreSQL
  stories:
  - 8.4.1
  phase: P1
  keywords:
  - xid8
  - pg_current_xact_id
  - pg_snapshot_xmin
  - snapshot
  - safe horizon
  - MVCC
  notes: |
    A row is visible only after its transaction commits, in any id order.
    A reader that saw id N+1 can miss id N if N commits later.
    pg_current_xact_id gives a 64-bit transaction id; xmin of a snapshot marks a safe horizon.
    Read only events from transactions older than that horizon to avoid gaps.
  sources:
  - url: https://www.postgresql.org/docs/current/functions-info.html
    title: System Information Functions (pg_current_xact_id, snapshots)
    kind: official-docs
    publisher: PostgreSQL Global Development Group
    version: PostgreSQL 19
    primary: true
    checked: 2026-11-24
  - url: https://www.postgresql.org/docs/current/mvcc.html
    title: Concurrency Control (MVCC)
    kind: official-docs
    publisher: PostgreSQL Global Development Group
    version: PostgreSQL 19
    primary: false
    checked: 2026-11-24
- id: realtime.starlette-websocket
  title: Starlette and FastAPI WebSocket endpoints
  stories:
  - 8.4.1
  phase: P1
  keywords:
  - WebSocket
  - accept
  - WebSocketDisconnect
  - receive
  - send
  notes: |
    The WebSocket class gives accept, send, receive and close for one connection.
    A client close raises WebSocketDisconnect on receive, so catch it to clean up.
    FastAPI re-exports the Starlette class and adds route decorators.
    A per-process connection list does not scale across processes; a bus is needed.
