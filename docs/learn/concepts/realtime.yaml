- id: realtime.xterm-flow-control
  title: xterm.js flow control
  stories:
  - 8.4.3
  phase: P1
  keywords:
  - xterm.js
  - flow control
  - watermark
  - ACK
  - backpressure
  - write callback
  notes: |
    term.write buffers data and draws it later; a fast producer can fill the buffer.
    xterm.js drops data above a fixed buffer limit of about 50 MB.
    Use high and low watermarks: pause the source above HIGH, resume below LOW.
    Over a WebSocket the client sends ACK messages so the server knows when to pause.
  sources:
  - url: https://xtermjs.org/docs/guides/flowcontrol/
    title: Flow control
    kind: official-docs
    publisher: xterm.js project
    version: docs guide
    primary: true
    checked: *id001
- id: realtime.psycopg3-notifies
  title: psycopg 3 LISTEN/NOTIFY
  stories:
  - 8.4.4
  phase: P1
  keywords:
  - psycopg
  - notifies
  - LISTEN
  - NOTIFY
  - autocommit
  - AsyncConnection
  notes: |
    Connection.notifies() is a generator that yields each notification.
    The timeout and stop_after parameters end the generator.
    Keep the listening connection in autocommit mode; a notify arrives only after commit.
    Use a dedicated connection for LISTEN, not one from the pool.
  sources:
  - url: https://www.psycopg.org/psycopg3/docs/advanced/async.html
    title: 'Concurrent operations: Asynchronous notifications'
    kind: api-reference
    publisher: Psycopg project
    version: psycopg 3.3 docs
    primary: true
    checked: *id001
- id: realtime.outbox-pattern
  title: Transactional outbox
  stories:
  - 8.4.4
  phase: P1
  keywords:
  - outbox
  - transactional outbox
  - message relay
  - at-least-once
  - idempotent
  notes: |
    Write the event row to an outbox table in the same transaction as the data change.
    A relay reads the outbox and publishes; an event exists only if the transaction commits.
    The relay can publish an event twice, so consumers must be idempotent.
    With Postgres, NOTIFY carries only the id; subscribers fetch the row.
  sources:
  - url: https://microservices.io/patterns/data/transactional-outbox.html
    title: 'Pattern: Transactional outbox'
    kind: official-docs
    publisher: microservices.io (Chris Richardson)
    version: pattern page
    primary: true
    checked: *id001
