- id: persistence.durable-write-fsync
  title: 'Durable writes: fsync and atomic rename'
  stories:
  - 8.8.1
  phase: P1
  keywords:
  - fsync
  - rename
  - durability
  - directory fsync
  notes: |
    Write a temp file, fsync it, rename it, then fsync the directory.
    fsync on a file does not make its directory entry durable.
    rename replaces the target in one atomic step.
    The save response waits until this sequence ends.
  sources:
  - url: https://man7.org/linux/man-pages/man2/fsync.2.html
    title: fsync(2)
    kind: man-page
