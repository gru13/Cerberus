- id: persistence.skip-locked
  title: SELECT FOR UPDATE SKIP LOCKED
  stories:
  - 8.5.2
  phase: P1
  keywords:
  - SKIP LOCKED
  - job queue
  - reaper
  notes: |
    Rows that another transaction holds locked are skipped, not waited on.
    Several workers can claim different rows without blocking each other.
    The result is not a consistent view, so use it for queues only.
    A reaper can use it to requeue expired leases safely.
  sources:
  - url: https://www.postgresql.org/docs/current/sql-select.html
    title: SELECT, locking clause
    kind: official-docs
    publisher: PostgreSQL Global Development Group
    version: PostgreSQL 19
    primary: true
    checked: 2026-11-24
  llms_txt: null
- id: persistence.sqlalchemy-async
