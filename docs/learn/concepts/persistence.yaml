- id: persistence.procrastinate-retry
  title: Procrastinate retry strategy
  stories:
  - 8.5.2
  phase: P1
  keywords:
  - RetryStrategy
  - max attempts
  - backoff
  notes: |
    A task can retry a set number of times or use a RetryStrategy object.
    Custom retry logic can decide per exception.
