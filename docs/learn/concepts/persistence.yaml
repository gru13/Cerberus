- id: persistence.fencing-token
  title: Fencing tokens for leases
  stories:
  - 8.5.2
  phase: P1
  keywords:
  - fencing token
  - lease
  - zombie worker
  - revision
  - compare and swap
  notes: |
    A lease uses time, so a slow worker can still act after its lease ends.
    A lease alone does not give mutual exclusion.
    A fencing token is a number that grows with each new holder.
    The resource rejects a write that carries an older token than one it has seen.
  sources:
  - url: https://etcd.io/docs/v3.5/learning/why/
    title: 'etcd versus other key-value stores: Notes on lock and lease'
    kind: official-docs
    publisher: etcd project (CNCF)
    version: etcd v3.5 docs
    primary: true
    checked: 2026-11-25
  llms_txt: null
