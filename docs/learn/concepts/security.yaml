- id: security.constant-time-compare
  title: Constant-time comparison
  stories:
  - 8.7.4
  - 4.3.3
  phase: P1
  keywords:
  - compare_digest
  - timing attack
  - constant time
  notes: |
    Plain == can leak how many leading bytes match.
    hmac.compare_digest compares in a way meant to resist timing attacks.
    Use it to check signatures and token hashes.
    The secrets module re-exports the same function.
  sources:
  - url: https://docs.python.org/3.14/library/hmac.html
    title: hmac - Keyed-Hashing for Message Authentication
    kind: official-docs
    publisher: Python Software Foundation
    version: Python 3.14 docs
    primary: true
    checked: &id001 2026-11-25
