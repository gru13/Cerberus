# Learning index: security concepts. The area comes from this file name; entries have no area key.
# Each entry: id (<area>.<name>), title, stories (guided story ids), phase (P0, P1, ...),
#   keywords, notes (short, own words), sources, llms_txt (optional link; omit when none).
# Each source: url (https, allowed host in index.yaml), title, kind, publisher, version,
#   primary (at least one true per concept), checked (date the link was last verified).
# Kinds: official-docs, api-reference, man-page, spec, project-repo.
- id: security.alembic-migrations
  title: Alembic migrations
  stories:
  - 8.2.2
  phase: P0
  keywords:
  - alembic
  - revision
  - alembic_version
  - migration
  notes: |
    Alembic runs versioned revision scripts against the database.
    It keeps its own alembic_version table, which has no org_id.
    Keep that table on the allow-list in the schema test.
    Migrations also create the RLS policies and roles.
  sources:
