  stories:
  - 2.2.3
  phase: P0
  keywords:
  - multi-stage
  - digest pin
  - base image
  - final stage
  notes: |
    Tags are mutable; a digest fixes the exact image.
    Pinning stops automatic security fixes, so plan digest updates.
    Multi-stage builds keep build tools out of the final image.
