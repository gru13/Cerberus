    title: secrets - Generate secure random numbers
    kind: official-docs
    publisher: Python Software Foundation
    version: Python 3.14 docs
    primary: false
    checked: *id001
- id: security.csrf-defenses
  title: CSRF defenses
  stories:
  - 8.1.5
  phase: P0
  keywords:
  - csrf
  - double-submit cookie
  - synchronizer token
  - origin check
  notes: |
    Cookie-authenticated writes need a CSRF defense even with SameSite set.
    The sheet prefers Sec-Fetch-Site first, with an Origin check as fallback.
    It prefers signed double-submit over the naive form.
    A missing or null Origin must not count as same-origin.
  sources:
  - url: https://cheatsheetseries.owasp.org/cheatsheets/Cross-Site_Request_Forgery_Prevention_Cheat_Sheet.html
    title: Cross-Site Request Forgery Prevention Cheat Sheet
    kind: official-docs
    publisher: OWASP Cheat Sheet Series
    version: undated (current)
    primary: true
    checked: 2026-11-24
- id: security.cswsh
  title: Cross-site WebSocket hijacking
  stories:
  - 8.1.5
  - 8.4.1
  phase: P0
  keywords:
  - cswsh
  - websocket origin
  - handshake
  notes: |
    Browsers attach cookies to WebSocket handshakes from any site.
    A hostile page can then open an authenticated socket.
    The server must validate Origin on every handshake and reject with 403.
    RFC 6455 says a server that skips the check accepts all origins.
  sources:
  - url: https://cheatsheetseries.owasp.org/cheatsheets/WebSocket_Security_Cheat_Sheet.html
    title: WebSocket Security Cheat Sheet
    kind: official-docs
    publisher: OWASP Cheat Sheet Series
    version: undated (current)
    primary: true
    checked: 2026-11-24
  - url: https://www.rfc-editor.org/rfc/rfc6455
    title: 'RFC 6455: The WebSocket Protocol'
    kind: spec
    publisher: IETF
    version: RFC 6455 (Dec 2011)
    primary: false
    checked: 2026-11-24
- id: security.dns-rebinding
  title: DNS rebinding and Host allow-list
  stories:
  - 8.1.5
  phase: P0
  keywords:
  - dns rebinding
  - host header
  - loopback
  notes: |
    A hostile site can re-point its DNS name at 127.0.0.1 and then call a local API from the browser.
    Domain checks done once at lookup time do not stop this.
    The fix is to validate the Host header on every request against a fixed list.
    The SSRF sheet states the limit of name-only allow-lists.
  sources:
  - url: https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    title: Server-Side Request Forgery Prevention Cheat Sheet
    kind: official-docs
