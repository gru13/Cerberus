[project]
name = "cerberus"
version = "0.1.0"
description = "Cerberus platform API: debugging practice and exam platform backend."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "typer>=0.29.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
cerberus = "cerberus.cli:app"

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.109",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF", "D", "ANN", "BLE", "TRY", "EM"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = "-ra"

[tool.ty.environment]
extra-paths = ["scripts"]
